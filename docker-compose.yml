# Prototype deployment only (SRS §18). No external network dependency:
# everything here runs on the local Docker network, with no outbound
# service configured. Verify with a dependency/network audit before demo
# (SRS §15.1 hackathon baseline requirement).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: satsa
      POSTGRES_USER: satsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - satsa_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
      - ./database/seed:/docker-entrypoint-initdb.d/seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsa -d satsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://satsa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/satsa
      SAT_PERSISTENCE_MODE: postgres
      SAT_ENV: production
      SAT_SECRET_KEY: ${SAT_SECRET_KEY:?set SAT_SECRET_KEY in .env}
    ports:
      - "8000:8000"
volumes:
  satsa_pgdata:
