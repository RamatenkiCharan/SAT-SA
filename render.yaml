databases:
  - name: satsa-db
    plan: free

services:
  - type: web
    name: satsa-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: satsa-db
          property: connectionString
      - key: SAT_PERSISTENCE_MODE
        value: postgres
      - key: SAT_ENV
        value: production
      - key: SAT_SECRET_KEY
        generateValue: true
      - key: SAT_ALLOWED_ORIGINS
        sync: false
      - key: SAT_SEED_DEMO_DATA
        value: "false"

  - type: web
    name: satsa-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_URL
        sync: false
